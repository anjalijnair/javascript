<body>
    <script>
    var friend={name:"anupama",
                birthDate:"1998-02-12"};
        function getBirthdayDetails(frnd)
        {
            var date=new Date(frnd.birthDate);
            var year=date.getFullYear();
            var day=date.getDate();
            var month=date.getMonth();
            var months=["january","february","march","april","may","june","july","august","september","october","november","december"];
            var monthName=months[month];
            const today=new Date();
            const age=today.getFullYear()-year;
            console.log(`${frnd.name} was born on ${day} ${monthName},${year} and is ${age} year old.`);
        }
        getBirthdayDetails(friend);
    </script>

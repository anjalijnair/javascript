    <p id="c"></p>
    <script>
        var object={
            itemName:"book",

              document.getElementById("c").innerHTML=ck;
            }
        };
        var existItem="object.itemName"in object;
        console.log(`item name exist ${existItem}`);
        var deleteItem=delete object.daysSinceDelivery;
        console.log(`dayssinve delivery deleted :${object.daysSinceDelivery}`);
        console.log(object);

        
    </script>
</body>

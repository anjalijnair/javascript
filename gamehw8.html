<body>
    <script>
        var num;
        for(var i=1;i<=5;i++)
        {
            num=parseInt(prompt("Enter a number between 1 and 5. "));
            switch(num)
            {
                case 1:
                    console.log("one");
                    break;
                case 2:
                    console.log("Two");
                    break;
                case 3:
                    console.log("Three");
                    break;
                case 4:
                    console.log("Four");
                    break;
                case 5:
                    console.log("Five");
                    break;
                default:
                    //console.log("Invalid Data");         

            }
            if(num==3)
            {
                console.log("You gussed it right");
                break;
            }
            else if(num<=5&&num!=3)
            {
                console.log("Wrong Guess.Try Again.");
                if(i==5)
                {
                    console.log("GAME OVER");
                }
            }
            
            else
            {
                console.log("Invalid Input ");
            }
        }
       
    </script>
